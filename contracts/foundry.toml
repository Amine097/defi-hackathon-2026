[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# RescueVault and its tests are pinned to one compiler; Morpho Blue v1.0.0 sources keep their own exact 0.8.19 pragma
# (only imported by the tests that deploy the real Morpho Blue code locally).
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "morpho-blue/=lib/morpho-blue/",
]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./out-deploy" }]

[fuzz]
runs = 512
seed = "0xfa017"

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
